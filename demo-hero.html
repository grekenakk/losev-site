<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>demo — hero concept</title>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #14100b;
    --fg: #f0ece4;
    --dim: #8a847a;
    --accent: #c5562a;
    --sans: 'Onest', system-ui, sans-serif;
    --mono: 'JetBrains Mono', monospace;
    --ease: cubic-bezier(.65,0,.1,1);
    --ease-spin: cubic-bezier(.22,1,.36,1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: var(--bg); color: var(--fg); font-family: var(--sans); }

  /* ---- intro veil: covers everything until GSAP reveals it ---- */
  .veil { position: fixed; inset: 0; z-index: 50; background: var(--bg);
    display: flex; align-items: center; justify-content: center; }

  .mark { font-family: var(--sans); font-weight: 900; letter-spacing: -0.04em;
    font-size: clamp(32px, 6vw, 64px); color: var(--accent);
    will-change: transform, opacity, filter; }

  /* ---- hero underneath ---- */
  .hero { position: relative; height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; gap: 22px; }

  .hero__line { overflow: hidden; }
  .hero__title { font-weight: 900; font-size: clamp(48px, 10vw, 130px);
    letter-spacing: -0.04em; line-height: 1; display: block;
    will-change: transform, filter; }

  .hero__sub { font-family: var(--mono); font-size: 14px; color: var(--dim);
    will-change: transform, opacity, filter; }

  .hero__ring { position: absolute; width: 640px; height: 640px; border-radius: 50%;
    border: 1px solid rgba(197,86,42,0.25);
    will-change: transform, opacity; }

  .hint { position: absolute; bottom: 32px; left: 50%; transform: translateX(-50%);
    font-family: var(--mono); font-size: 11px; color: var(--dim); letter-spacing: .08em; }

  /* ---- second panel, revealed on scroll ---- */
  .next { min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 60px 28px; text-align: center; }
  .next__text { max-width: 480px; font-size: clamp(20px, 3vw, 28px); font-weight: 600;
    line-height: 1.4; letter-spacing: -0.01em; color: var(--dim);
    will-change: transform, opacity, filter; }
  .next__text b { color: var(--fg); font-weight: 800; }
</style>
</head>
<body>

  <div class="veil" id="veil">
    <div class="mark" id="mark">ЯЛ</div>
  </div>

  <section class="hero" id="hero">
    <div class="hero__ring" aria-hidden="true"></div>
    <h1>
      <span class="hero__line"><span class="hero__title hero__title--1">Ян Лосев</span></span>
    </h1>
    <p class="hero__sub">founder &amp; developer — строю продукты и помогаю бизнесу расти</p>
    <span class="hint">SCROLL / ЛИСТАЙ ВНИЗ</span>
  </section>

  <section class="next">
    <p class="next__text" id="nextText">Дальше — <b>кейсы, услуги и стартапы</b>, оформленные в такой же логике плавных переходов.</p>
  </section>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/ScrollTrigger.min.js"></script>
<script>
  gsap.registerPlugin(ScrollTrigger);

  // Initial state — set once, before any tween runs, so there's no flash of
  // unstyled content while the fonts/GSAP script are still loading.
  gsap.set(".mark", { autoAlpha: 0, scale: 0.3, rotation: -620, filter: "blur(18px)" });
  gsap.set(".hero__title", { yPercent: 110, filter: "blur(14px)" });
  gsap.set(".hero__sub", { autoAlpha: 0, filter: "blur(10px)" });
  gsap.set(".hero__ring", { autoAlpha: 0, scale: 0.75 });
  gsap.set(".hint", { autoAlpha: 0 });
  gsap.set("#nextText", { autoAlpha: 0, y: 24, filter: "blur(10px)" });

  const tl = gsap.timeline({ defaults: { ease: "power2.inOut" } });

  tl.addLabel("markIn", 0.25)
    .to(".mark", {
      autoAlpha: 1, scale: 1, rotation: 0, filter: "blur(0px)",
      duration: 2.2, ease: "expo.out",
    }, "markIn")
    .addLabel("markOut", "+=0.65")
    .to(".mark", {
      autoAlpha: 0, scale: 2.1, rotation: 220, filter: "blur(22px)",
      duration: 1.6,
    }, "markOut")
    .to(".veil", { autoAlpha: 0, duration: 1.1 }, "markOut+=0.3")
    .to(".hero__title", { yPercent: 0, filter: "blur(0px)", duration: 1.8 }, "markOut+=0.3")
    .to(".hero__sub", { autoAlpha: 1, filter: "blur(0px)", duration: 1.6 }, "markOut+=0.8")
    .to(".hero__ring", { autoAlpha: 1, scale: 1, duration: 2 }, "markOut+=0.6")
    .to(".hint", { autoAlpha: 1, duration: 1 }, "markOut+=1.1");

  gsap.to("#nextText", {
    autoAlpha: 1, filter: "blur(0px)", y: 0, duration: 1,
    scrollTrigger: { trigger: "#nextText", start: "top 80%" },
  });
</script>
</body>
</html>
