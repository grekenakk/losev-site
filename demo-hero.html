<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>demo — hero concept</title>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0a0908;
    --fg: #f0ece4;
    --dim: #8a847a;
    --accent: #c5562a;
    --sans: 'Onest', system-ui, sans-serif;
    --mono: 'JetBrains Mono', monospace;
    --ease: cubic-bezier(.77,0,.175,1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: var(--bg); color: var(--fg); font-family: var(--sans);
    height: 100%; overflow: hidden; }

  /* ---- intro veil: covers everything until the mark has revealed itself ---- */
  .veil { position: fixed; inset: 0; z-index: 50; background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    transition: opacity 1.1s var(--ease), visibility 1.1s var(--ease); }
  .veil.is-done { opacity: 0; visibility: hidden; pointer-events: none; }

  .mark { width: 64px; height: 64px; border: 1px solid var(--accent); border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-size: 13px; color: var(--accent);
    filter: blur(16px); opacity: 0; transform: scale(.7);
    transition: filter 1s var(--ease), opacity 1s var(--ease), transform 1s var(--ease); }
  .mark.is-in { filter: blur(0); opacity: 1; transform: scale(1); }
  .mark.is-out { filter: blur(20px); opacity: 0; transform: scale(1.6); }

  /* ---- hero underneath ---- */
  .hero { position: relative; height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; gap: 22px; }

  .hero__line { overflow: hidden; }
  .hero__title { font-weight: 900; font-size: clamp(48px, 10vw, 130px);
    letter-spacing: -0.04em; line-height: 1; display: block;
    transform: translateY(110%); filter: blur(10px);
    transition: transform 1.1s var(--ease), filter 1.1s var(--ease); }
  .hero.is-revealed .hero__title { transform: translateY(0); filter: blur(0); }
  .hero.is-revealed .hero__title--2 { transition-delay: .08s; }

  .hero__sub { font-family: var(--mono); font-size: 14px; color: var(--dim);
    opacity: 0; filter: blur(8px);
    transition: opacity 1s var(--ease) .4s, filter 1s var(--ease) .4s; }
  .hero.is-revealed .hero__sub { opacity: 1; filter: blur(0); }

  .hero__ring { position: absolute; width: 640px; height: 640px; border-radius: 50%;
    border: 1px solid rgba(197,86,42,0.25); opacity: 0;
    transition: opacity 1.4s var(--ease) .2s, transform 1.4s var(--ease) .2s;
    transform: scale(.8); }
  .hero.is-revealed .hero__ring { opacity: 1; transform: scale(1); }

  .hint { position: absolute; bottom: 32px; left: 50%; transform: translateX(-50%);
    font-family: var(--mono); font-size: 11px; color: var(--dim); letter-spacing: .08em;
    opacity: 0; transition: opacity 1s var(--ease) .8s; }
  .hero.is-revealed .hint { opacity: 1; }
</style>
</head>
<body>

  <div class="veil" id="veil">
    <div class="mark" id="mark">Y</div>
  </div>

  <section class="hero" id="hero">
    <div class="hero__ring" aria-hidden="true"></div>
    <h1>
      <span class="hero__line"><span class="hero__title hero__title--1">Ян Лосев</span></span>
    </h1>
    <p class="hero__sub">founder &amp; developer — строю продукты и помогаю бизнесу расти</p>
    <span class="hint">SCROLL / ЛИСТАЙ ВНИЗ</span>
  </section>

<script>
  const mark = document.getElementById('mark');
  const veil = document.getElementById('veil');
  const hero = document.getElementById('hero');

  setTimeout(() => mark.classList.add('is-in'), 150);
  setTimeout(() => {
    mark.classList.remove('is-in');
    mark.classList.add('is-out');
  }, 950);
  setTimeout(() => {
    veil.classList.add('is-done');
    hero.classList.add('is-revealed');
  }, 1250);
</script>
</body>
</html>
